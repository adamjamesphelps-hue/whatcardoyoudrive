<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 260px;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: #1c1e1f;
    color: #eae6d9;
  }
  .header {
    padding: 14px 16px 10px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .5px;
  }
  .header .dot { color: #f2c230; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-top: 1px solid #333638;
    font-size: 12.5px;
  }
  .switch {
    position: relative;
    width: 34px;
    height: 18px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #46484a;
    border-radius: 18px;
    transition: .15s;
  }
  .slider:before {
    content: "";
    position: absolute;
    height: 14px; width: 14px;
    left: 2px; bottom: 2px;
    background: #eae6d9;
    border-radius: 50%;
    transition: .15s;
  }
  input:checked + .slider { background: #2c5f8a; }
  input:checked + .slider:before { transform: translateX(16px); }
  .footer {
    padding: 12px 16px 16px;
    border-top: 1px solid #333638;
  }
  a.btn {
    display: block;
    text-align: center;
    background: #f2c230;
    color: #1c1e1f;
    font-weight: 600;
    font-size: 12.5px;
    text-decoration: none;
    padding: 9px 0;
    border-radius: 6px;
  }
  p.note {
    font-size: 11px;
    color: #8f8d87;
    margin: 8px 0 0;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="header">whatcardoyoudrive<span class="dot">.</span>com</div>
  <div class="row">
    <span>Show overlay on car pages</span>
    <label class="switch">
      <input type="checkbox" id="toggle-enabled" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="footer">
    <a class="btn" href="https://whatcardoyoudrive.com" target="_blank" rel="noopener">Add your car</a>
    <p class="note">Shows real driver reasons on Google, Cars.com, CarGurus, Edmunds, Carvana, Autotrader, and KBB.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
